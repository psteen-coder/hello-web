name: Bug report
description: Something on the site is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open index.html
        2. Click ...
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: index.html
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 131 on macOS

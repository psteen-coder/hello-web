name: html-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Check formatting (Prettier)
        run: npm run format:check
      - name: Lint (HTML, CSS, Markdown)
        run: npm run lint
      - name: Browser smoke test (Playwright, Chromium)
        run: npx playwright install --with-deps chromium && npm test
      - name: Check internal links (lychee, offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --exclude-path node_modules
            './**/*.html' './**/*.md'
          fail: true
      - name: Accessibility check (Lighthouse CI, score >= 0.9)
        run: npm run lighthouse

name: html-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Validate HTML
        run: npx --yes html-validate@9 "**/*.html"
      - name: Lint CSS
        run: npx stylelint "**/*.css"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple hello-world web page." />
    <meta name="theme-color" content="#0d1117" />
    <title>Hello, world</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var prefersLight =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches;
        if (saved === "light" || (saved !== "dark" && prefersLight)) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <nav class="site-nav" aria-label="Site">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="changelog.html">Changelog</a>
    </nav>
    <button
      type="button"
      id="theme-toggle"
      class="theme-toggle"
      aria-label="Switch theme"
      aria-pressed="false"
    >
      Switch theme
    </button>
    <main id="main" tabindex="-1">
      <noscript
        ><p class="noscript">
          The live clock, greeting, theme toggle and saved preferences need
          JavaScript.
        </p></noscript
      >
      <h1 id="greeting">Hello, world</h1>
      <p>
        <button type="button" id="copy-greeting" class="small-button">
          Copy greeting
        </button>
        <span
          id="copy-status"
          class="visually-hidden"
          aria-live="polite"
        ></span>
      </p>
      <p class="clock-line">
        <time id="now" class="clock"></time> <span id="tz" class="tz"></span>
      </p>
      <p class="name-field">
        <label for="visitor-name">Your name</label>
        <input
          type="text"
          id="visitor-name"
          class="name-input"
          maxlength="50"
          autocomplete="given-name"
        />
      </p>
      <p>
        <button type="button" id="reset-prefs" class="small-button">
          Reset preferences
        </button>
      </p>
      <p>
        <button type="button" id="clock-format" class="small-button">
          Use 24-hour time
        </button>
      </p>
      <p>
        <a href="https://github.com/psteen-coder/hello-web">View on GitHub</a>
      </p>
    </main>
    <footer>
      <p>
        &copy; 2026 psteen-coder &middot;
        <a href="https://github.com/psteen-coder/hello-web/blob/main/LICENSE"
          >MIT License</a
        >
      </p>
    </footer>
    <script src="theme.js"></script>
    <script src="clock.js"></script>
    <script src="prefs.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple hello-world web page." />
    <meta name="theme-color" content="#0d1117" />
    <title>Hello, world</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var prefersLight =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches;
        if (saved === "light" || (saved !== "dark" && prefersLight)) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button type="button" id="theme-toggle" class="theme-toggle">
      Switch theme
    </button>
    <h1>Hello, world</h1>
    <p><time id="now" class="clock"></time></p>
    <p>
      <a href="about.html">About</a> &middot;
      <a href="https://github.com/psteen-coder/hello-web">View on GitHub</a>
    </p>
    <footer>
      <p>
        &copy; 2026 psteen-coder &middot;
        <a href="https://github.com/psteen-coder/hello-web/blob/main/LICENSE"
          >MIT License</a
        >
      </p>
    </footer>
    <script src="theme.js"></script>
    <script src="clock.js"></script>
  </body>
</html>
